services:
  - type: web
    name: securemonitor-ai
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: ./data
      - key: COOKIE_SAMESITE
        value: Lax
      - key: ALERT_COOLDOWN_MIN
        value: "10"
